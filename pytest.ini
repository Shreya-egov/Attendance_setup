[pytest]
pythonpath = .
testpaths = tests
addopts = -v -ra --strict-markers
markers =
    preflight: read-only checks of the account, MDMS and config (safe anywhere)
    create: creates a new campaign (tests/test_10_campaign.py)
    attendance: registers and user mapping (tests/test_20, test_30)
    payment: billing cycle and wages (tests/test_40)
    writes: changes server state; deselect with -m "not writes"
